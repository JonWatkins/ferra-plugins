name = "cpp"
version = "0.1.0"
description = "C++: highlighting, indentation, comments and clangd"
ferra = ">=0.1"

[languages.cpp]
extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx", "h++"]
comment = "//"
language-server = { command = "clangd", roots = ["compile_commands.json", "CMakeLists.txt", ".clangd"] }

[grammars.cpp]
git = "https://github.com/tree-sitter/tree-sitter-cpp"
rev = "f41e1a044c8a84ea9fa8577fdd2eab92ec96de02"  # v0.23.4
