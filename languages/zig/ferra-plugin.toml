name = "zig"
version = "0.1.0"
description = "Zig: highlighting, indentation, comments and zls"
ferra = ">=0.1"

[languages.zig]
extensions = ["zig", "zon"]
comment = "//"
options = { tab-width = 4 }
language-server = { command = "zls", roots = ["build.zig", "build.zig.zon"] }

# The grammar's own queries are used (written for Neovim; ferra reads them).
[grammars.zig]
git = "https://github.com/tree-sitter-grammars/tree-sitter-zig"
rev = "6479aa13f32f701c383083d8b28360ebd682fb7d"
