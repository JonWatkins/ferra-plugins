name = "php"
version = "0.1.0"
description = "PHP: highlighting, indentation, comments and intelephense"
ferra = ">=0.1"

[languages.php]
extensions = ["php", "phtml"]
shebangs = ["php"]
comment = "//"
language-server = { command = "intelephense", args = ["--stdio"], roots = ["composer.json"] }

# The repository holds two grammars: `php` (PHP in HTML) is this one.
[grammars.php]
git = "https://github.com/tree-sitter/tree-sitter-php"
rev = "58d5643086ae60e93a3746cca648363ee97c8761"
path = "php"
