name = "go"
version = "0.1.0"
description = "Go: highlighting, indentation, comments and gopls"
ferra = ">=0.1"

[languages.go]
extensions = ["go"]
comment = "//"
options = { expand-tab = false }
language-server = { command = "gopls", roots = ["go.mod", "go.work"] }

[grammars.go]
git = "https://github.com/tree-sitter/tree-sitter-go"
rev = "1547678a9da59885853f5f5cc8a99cc203fa2e2c"  # v0.25.0
