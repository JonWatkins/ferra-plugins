name = "c"
version = "0.1.0"
description = "C: highlighting, indentation, comments and clangd"
ferra = ">=0.1"

[languages.c]
extensions = ["c", "h"]
comment = "//"
language-server = { command = "clangd", roots = ["compile_commands.json", "CMakeLists.txt", ".clangd"] }

[grammars.c]
git = "https://github.com/tree-sitter/tree-sitter-c"
rev = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"  # v0.24.2
