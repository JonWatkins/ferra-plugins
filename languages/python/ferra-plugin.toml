name = "python"
version = "0.1.0"
description = "Python: highlighting, indentation, comments and pyright"
ferra = ">=0.1"

[languages.python]
extensions = ["py", "pyi"]
shebangs = ["python"]
comment = "#"
language-server = { command = "pyright-langserver", args = ["--stdio"], roots = ["pyproject.toml", "setup.py", "requirements.txt"] }

[grammars.python]
git = "https://github.com/tree-sitter/tree-sitter-python"
rev = "293fdc02038ee2bf0e2e206711b69c90ac0d413f"  # v0.25.0
