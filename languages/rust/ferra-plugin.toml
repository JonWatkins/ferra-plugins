name = "rust"
version = "0.1.1"
description = "Rust: highlighting, indentation, comments and rust-analyzer"
ferra = ">=0.1"

[languages.rust]
extensions = ["rs"]
comment = "//"
# rust-analyzer checks into a folder of its own (target/rust-analyzer), so
# its `cargo check` doesn't wait on cargo build or cargo test for target/'s
# lock, or they on it.
language-server = { command = "rust-analyzer", roots = ["Cargo.toml"], settings = { "rust-analyzer" = { cargo = { targetDir = true } } } }

[grammars.rust]
git = "https://github.com/tree-sitter/tree-sitter-rust"
rev = "77a3747266f4d621d0757825e6b11edcbf991ca5"  # v0.24.2
