name = "ruby"
version = "0.1.0"
description = "Ruby: highlighting, indentation, comments and ruby-lsp"
ferra = ">=0.1"

[languages.ruby]
extensions = ["rb", "rake", "gemspec", "ru"]
file-names = ["Rakefile", "Gemfile", "Guardfile", "Podfile", "Vagrantfile", "Brewfile"]
shebangs = ["ruby"]
comment = "#"
options = { tab-width = 2 }
language-server = { command = "ruby-lsp", roots = ["Gemfile"] }

[grammars.ruby]
git = "https://github.com/tree-sitter/tree-sitter-ruby"
rev = "ad907a69da0c8a4f7a943a7fe012712208da6dee"
