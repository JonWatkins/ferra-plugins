name = "css"
version = "0.1.0"
description = "CSS: highlighting, indentation, comments and its language server"
ferra = ">=0.1"

[languages.css]
extensions = ["css"]
block-comment = ["/*", "*/"]
language-server = { command = "vscode-css-language-server", args = ["--stdio"] }

[grammars.css]
git = "https://github.com/tree-sitter/tree-sitter-css"
rev = "dda5cfc5722c429eaba1c910ca32c2c0c5bb1a3f"  # v0.25.0
