name = "javascript"
version = "0.1.0"
description = "JavaScript and JSX: highlighting, indentation, comments and typescript-language-server"
ferra = ">=0.1"

[languages.javascript]
extensions = ["js", "mjs", "cjs", "jsx"]
shebangs = ["node"]
comment = "//"
language-server = { command = "typescript-language-server", args = ["--stdio"], roots = ["package.json", "tsconfig.json", "jsconfig.json"] }

[grammars.javascript]
git = "https://github.com/tree-sitter/tree-sitter-javascript"
rev = "44c892e0be055ac465d5eeddae6d3e194424e7de"  # v0.25.0
