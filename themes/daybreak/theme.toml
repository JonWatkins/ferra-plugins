"ui.menubar" = { fg = "#4a5170", bg = "#fbfaf7" }
"ui.menubar.open" = { fg = "#303a5c", bg = "#cfdcf5" }
"ui.menubar.letter" = { modifiers = ["underlined"] }
# The lines under the menu bar and above the terminal panel.
"ui.menubar.border" = { fg = "#d3cfc5", bg = "#fbfaf7" }
"ui.terminal.border" = { fg = "#d3cfc5" }
"ui.panel.tab" = { fg = "#8a8f99", bg = "#f0eee8" }
"ui.panel.tab.shown" = { fg = "#303a5c", bg = "#f0eee8", modifiers = ["bold"] }
"ui.panel.detail" = "#8b90a6"
"ui.menu.key" = "#8a8f99"
"ui.menu.separator" = "#d3cfc5"
"ui.popup.prompt" = "#2f5fc4"
"ui.popup.selected" = { bg = "#cfdcf5" }
"ui.popup.match" = { fg = "#a8730f", modifiers = ["bold"] }
"ui.popup.detail" = "#8a8f99"
"ui.linenr" = "#b4b0a6"
"ui.linenr.selected" = { fg = "#3a3e47", modifiers = ["bold"] }
"ui.statusline" = { fg = "#5c626d", bg = "#f0eee8" }
"ui.statusline.normal" = { fg = "#fbfaf7", bg = "#2f5fc4", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#fbfaf7", bg = "#4e8a1e", modifiers = ["bold"] }
"ui.statusline.replace" = { fg = "#fbfaf7", bg = "#c8364f", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "#fbfaf7", bg = "#a8730f", modifiers = ["bold"] }
"ui.statusline.operator" = { fg = "#fbfaf7", bg = "#2f5fc4", modifiers = ["bold"] }
"ui.statusline.visual" = { fg = "#fbfaf7", bg = "#7b4ec0", modifiers = ["bold"] }
"ui.statusline.picker" = { fg = "#fbfaf7", bg = "#0f7fa8", modifiers = ["bold"] }
"ui.statusline.sidebar" = { fg = "#fbfaf7", bg = "#4e8a1e", modifiers = ["bold"] }
"ui.statusline.find" = { fg = "#fbfaf7", bg = "#c25a17", modifiers = ["bold"] }
"ui.statusline.terminal" = { fg = "#fbfaf7", bg = "#7b4ec0", modifiers = ["bold"] }
"ui.statusline.popup" = { fg = "#fbfaf7", bg = "#0f7fa8", modifiers = ["bold"] }
"ui.statusline.input" = { fg = "#fbfaf7", bg = "#a8730f", modifiers = ["bold"] }
"ui.statusline.pending" = { fg = "#a8730f", bg = "#f0eee8" }
"ui.statusline.lsp" = { fg = "#8a8f99", bg = "#f0eee8" }
